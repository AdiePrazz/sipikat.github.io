<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Form Tanggapan PDPB - KPU Kabupaten Malang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
html{color-scheme:light}body{margin:0}
/* Layout: dua kolom. Kiri formulir isian per bagian, kanan pratinjau kertas Model A yang ikut berubah saat diketik.
   Tab kedua menampilkan meja helpdesk berbentuk tabel tindak lanjut. */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#16181D; --muted:#5A606C; --line:#D8DBE1; --line-strong:#B9BEC8;
  --accent:#B3202A; --accent-ink:#FFFFFF; --accent-soft:#FBE9EA;
  --st-baru:#2A5DA8; --st-proses:#946000; --st-selesai:#1C7447; --st-tolak:#5A606C;
  --paper:#FFFFFF; --paper-ink:#141414; --paper-mute:#8A8A8A; --paper-line:#141414;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-doc:Arial,'Liberation Sans',Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2D313A; --line-strong:#454B57;
    --accent:#E8646C; --accent-ink:#121418; --accent-soft:#3A2023;
    --st-baru:#7FA8E8; --st-proses:#E3B04B; --st-selesai:#5CC391; --st-tolak:#9BA2AF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2D313A; --line-strong:#454B57;
  --accent:#E8646C; --accent-ink:#121418; --accent-soft:#3A2023;
  --st-baru:#7FA8E8; --st-proses:#E3B04B; --st-selesai:#5CC391; --st-tolak:#9BA2AF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.35rem,3.2vw,1.9rem);font-weight:600;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.top .sub{color:var(--muted);margin-top:6px;max-width:60ch}
.proto{display:inline-block;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:3px;margin-bottom:10px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.count{font-family:var(--font-mono);font-size:.75rem;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.count:empty{display:none}

.split{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:1000px){.split{grid-template-columns:minmax(0,540px) minmax(0,1fr)}.preview-col{align-self:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sec{padding:22px 22px 6px;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;margin-bottom:14px}
.sec-note{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px}
.span2{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.fld>label,.lbl{font-weight:500;font-size:.875rem}
input[type=text],input[type=date],select,textarea{width:100%;min-height:44px;padding:9px 12px;background:var(--bg);border:1px solid var(--line-strong);border-radius:6px}
textarea{resize:vertical;min-height:70px}
input[readonly]{color:var(--muted);background:transparent;border-style:dashed}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--accent)!important;background:var(--accent-soft)}
.sub2{display:flex;justify-content:space-between;gap:8px;min-height:1.1em;font-size:.78rem}
.hint{color:var(--muted);font-family:var(--font-mono)}
.err{color:var(--accent);font-weight:500;text-align:right}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:12px;align-items:center;border:1px solid var(--line-strong);border-radius:6px;padding:11px 14px;cursor:pointer;background:var(--bg)}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none}
.radio small{display:block;color:var(--muted)}
.file{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px dashed var(--line-strong);border-radius:6px;padding:12px 14px;background:var(--bg)}
.file input{max-width:100%}
.check{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.check input{accent-color:var(--accent);width:20px;height:20px;margin:2px 0 0;flex:none}
.actions{padding:18px 22px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:10px 18px;min-height:44px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:34px;padding:5px 12px;font-size:.85rem}
.fine{font-size:.82rem;color:var(--muted);max-width:44ch}

.done{padding:24px 22px;display:grid;gap:14px}
.done .ticket{font-family:var(--font-mono);font-size:1.5rem;font-weight:500;letter-spacing:.02em;border:1px solid var(--line-strong);border-radius:6px;padding:10px 14px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.done .row{display:flex;flex-wrap:wrap;gap:10px}

.pv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pv-head span{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.pagebox{width:100%;overflow:hidden;background:var(--paper);border:1px solid var(--line-strong);box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);border-radius:2px}
.paper{width:794px;min-height:1123px;padding:76px 76px 64px;background:var(--paper);color:var(--paper-ink);font-family:var(--font-doc);font-size:16px;line-height:1.15;transform-origin:0 0}
.paper .lamp{margin-left:46%;text-transform:uppercase;text-align:left}
.paper .mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:14px 0 26px}
.paper .logo{width:83px;height:83px;border:1px dashed var(--paper-mute);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--paper-mute);text-align:center;grid-column:2}
.paper .mid img{width:83px;height:83px;object-fit:contain;grid-column:2}
.paper .model{grid-column:3;justify-self:end;border:1px solid var(--paper-line);padding:6px 16px;text-align:center}
.paper h3{text-align:center;font-weight:400;font-size:16px;line-height:1.5;margin:0 0 10px}
.paper p{margin:0 0 8px;line-height:1.5;text-align:justify}
.paper p.ln{text-align:left}
.paper .blank{color:var(--paper-mute)}
.paper ol{list-style:none;margin:0 0 8px;padding:0}
.paper ol li{display:flex;gap:10px;line-height:1.5;text-align:justify}
.paper .box{flex:none;width:2.6em;white-space:pre}
.paper table{width:100%;border-collapse:collapse;margin:4px 0 16px;table-layout:fixed}
.paper td{border:1px solid var(--paper-line);padding:3px 7px;vertical-align:top;overflow-wrap:anywhere;text-align:left}
.paper td:nth-child(1){width:31%}
.paper td:nth-child(2){width:22px;text-align:center;padding:3px 0}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center;margin-top:14px}
.paper .sig .space{height:62px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--paper-mute);font-style:italic}
.paper .foot{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px;align-items:start}
.paper .note{font-size:13px;font-style:italic;line-height:1.15}
.paper .ketua{text-align:center;line-height:1.15}
.paper .ketua .ttd{display:block;margin:30px 0}
.paper .tk{font-family:var(--font-mono);font-size:11px;color:var(--paper-mute);margin-top:14px;text-align:right}

.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:500;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--font-mono);font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.banner{border:1px solid var(--line-strong);border-left:4px solid var(--st-proses);background:var(--surface);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:.88rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.sheet{border-collapse:collapse;width:100%;min-width:1040px;font-size:.86rem}
.sheet th{position:sticky;top:0;text-align:left;font-family:var(--font-mono);font-weight:500;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line-strong);background:var(--surface);white-space:nowrap}
.sheet td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.sheet tr:last-child td{border-bottom:0}
.sheet .mono{font-family:var(--font-mono);font-size:.8rem;white-space:nowrap}
.sheet .nm{font-weight:500}
.sheet .sm{color:var(--muted);font-size:.78rem}
.sheet select,.sheet input{min-height:34px;padding:4px 8px;font-size:.84rem;background:var(--bg)}
.pill{display:inline-block;font-size:.72rem;font-family:var(--font-mono);border:1px solid currentColor;border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:1px;color:var(--muted)}
.stat-Baru{border-left:4px solid var(--st-baru)}
.stat-Diproses{border-left:4px solid var(--st-proses)}
.stat-Selesai{border-left:4px solid var(--st-selesai)}
.stat-Ditolak{border-left:4px solid var(--st-tolak)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

.overlay{position:fixed;inset:0;background:rgba(10,12,16,.62);z-index:20;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay .panel{max-width:780px;margin:0 auto;display:grid;gap:12px}
.overlay .panel .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,6px)}}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Form Tanggapan dan Masukan Masyarakat</h1>
      <p class="sub">KPU Kabupaten Malang. Pemutakhiran Data Pemilih Berkelanjutan (PDPB). Isian Anda menjadi dokumen Model A-Tanggapan Masyarakat-PDPB dan diteruskan ke helpdesk KPU.</p>
    </div>
    
  </header>

  <main id="view-form" role="tabpanel" aria-labelledby="tab-form">
    <div class="split">
      <div>
        <div class="card" id="doneCard" hidden></div>
        <form class="card" id="theForm" novalidate autocomplete="off"></form>
      </div>
      <aside class="preview-col" aria-label="Pratinjau Model A">
        <div class="pv-head"><h2>Pratinjau Model A</h2><span id="pvState">Berubah saat Anda mengetik</span></div>
        <div id="paper"></div>
      </aside>
    </div>
  </main>

  </div>


<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* Logo resmi KPU: tempel data URI PNG di sini agar tampil di tengah dokumen (pratinjau dan PDF). Font dokumen: Arial (Helvetica pada PDF). */
var LOGO_DATA_URL = null;


var $ = function(id){ return document.getElementById(id); };
var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var ALASAN = {1:'Kesalahan data pemilih',2:'Pemilih Baru',3:'Pemilih Tidak Memenuhi Syarat'};
var STATUS_KAWIN = {B:'B (Belum Kawin)',S:'S (Sudah Kawin)',P:'P (Pernah Kawin)'};
var JK = {L:'Laki-laki',P:'Perempuan'};
var STATUSES = ['Baru','Diproses','Selesai','Ditolak'];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
var TODAY = isoOf(new Date());
function longDate(iso){ if(!iso) return ''; var d = parseISO(iso); return d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); }
function calcAge(lahir, ref){
  if(!lahir) return '';
  var b = parseISO(lahir), r = parseISO(ref || TODAY);
  if(isNaN(b) || b > r) return '';
  var a = r.getFullYear() - b.getFullYear();
  if(r.getMonth() < b.getMonth() || (r.getMonth() === b.getMonth() && r.getDate() < b.getDate())) a--;
  return a;
}
function maskNik(n){ n = String(n || ''); return n.length === 16 ? n.slice(0,6) + '••••••' + n.slice(-4) : n; }

/* ---------- konfigurasi formulir ---------- */
var SECTIONS = [
  {title:'Kantor KPU dan tanggal', note:'Mengisi kalimat pembuka', fields:[
    {id:'kpu', label:'KPU Kabupaten/Kota', type:'readonly', value:'Kabupaten Malang', span:2, hint:'Tanggapan ini ditujukan ke KPU Kabupaten Malang'},
    {id:'tglShow', label:'Tanggal tanggapan', type:'readonly', span:2, hint:'Diisi otomatis dengan tanggal hari ini'}
  ]},
  {title:'Data pemberi masukan', note:'Mengisi NIK, Nama, Alamat', fields:[
    {id:'pnik', label:'NIK Anda', type:'text', digits:16, ph:'16 digit', span:2},
    {id:'pnama', label:'Nama lengkap Anda', type:'text', span:2},
    {id:'palamat', label:'Alamat Anda', type:'textarea', span:2}
  ]},
  {title:'Alasan memberikan tanggapan', note:'Mengisi daftar alasan 1 sampai 3', fields:[{id:'alasan', type:'radio'}]},
  {title:'Data pemilih yang ditanggapi', note:'Mengisi tabel materi tanggapan', fields:[
    {id:'v_nama', label:'Nama pemilih', type:'text', span:2},
    {id:'v_kk', label:'No. KK', type:'text', digits:16, ph:'16 digit'},
    {id:'v_nik', label:'NIK pemilih', type:'text', digits:16, ph:'16 digit'},
    {id:'v_tempat', label:'Tempat lahir', type:'text'},
    {id:'v_lahir', label:'Tanggal lahir', type:'date'},
    {id:'v_umur', label:'Umur', type:'readonly', hint:'Dihitung dari tanggal lahir'},
    {id:'v_status', label:'Status perkawinan', type:'select', opts:[['B','B. Belum kawin'],['S','S. Sudah kawin'],['P','P. Pernah kawin']]},
    {id:'v_jk', label:'Jenis kelamin', type:'select', opts:[['L','Laki-laki'],['P','Perempuan']]},
    {id:'v_alamat', label:'Alamat', type:'textarea', span:2},
    {id:'v_jalan', label:'Jalan/Dukuh', type:'text', span:2},
    {id:'v_rt', label:'RT', type:'text', digits:3, ph:'001'},
    {id:'v_rw', label:'RW', type:'text', digits:3, ph:'002'}
  ]},
  {title:'Lampiran dan pernyataan', note:'Catatan bertanda * pada Model A', fields:[{id:'bukti', type:'file'},{id:'setuju', type:'check'}]}
];
var ALL_IDS = ['kpu','pnik','pnama','palamat','alasan','v_nama','v_kk','v_nik','v_tempat','v_lahir','v_status','v_jk','v_alamat','v_jalan','v_rt','v_rw','bukti','setuju'];

function fieldHTML(f){
  var id = f.id, ctl = '', span = f.span === 2 ? ' span2' : '';
  var hint = f.digits > 3 ? '0/' + f.digits + ' digit' : (f.hint || '');
  if(f.type === 'text') ctl = '<input type="text" id="' + id + '"' + (f.digits ? ' inputmode="numeric" maxlength="' + f.digits + '"' : '') + (f.list ? ' list="' + f.list + '"' : '') + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>';
  else if(f.type === 'date') ctl = '<input type="date" id="' + id + '" max="' + TODAY + '" min="1900-01-01">';
  else if(f.type === 'textarea') ctl = '<textarea id="' + id + '" rows="2"></textarea>';
  else if(f.type === 'readonly') ctl = '<input type="text" id="' + id + '" readonly tabindex="-1"' + (f.value ? ' value="' + esc(f.value) + '"' : '') + '>';
  else if(f.type === 'select') ctl = '<select id="' + id + '"><option value="">Pilih</option>' + f.opts.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('') + '</select>';
  else if(f.type === 'radio'){
    return '<div class="fld span2" data-for="alasan"><span class="lbl" id="l_alasan">Pilih satu alasan</span><div class="radios" role="radiogroup" aria-labelledby="l_alasan">' +
      [1,2,3].map(function(n){ return '<label class="radio"><input type="radio" name="alasan" value="' + n + '"><span>' + ALASAN[n] + '<small>' + ['Ada data pemilih yang tidak sesuai dengan kenyataan.','Warga yang belum tercatat dan perlu didaftarkan.','Pemilih yang tercatat tetapi sudah tidak memenuhi syarat, misalnya meninggal dunia atau pindah.'][n-1] + '</small></span></label>'; }).join('') +
      '</div><div class="sub2"><span class="hint"></span><span class="err" id="e_alasan" role="alert"></span></div></div>';
  }
  else if(f.type === 'file'){
    return '<div class="fld span2" data-for="bukti"><label class="lbl" for="bukti">Bukti identitas kependudukan atau surat keterangan lainnya dari Pemerintah</label><div class="file"><input type="file" id="bukti" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"><span class="hint" id="h_bukti">PDF, JPG, atau PNG, maksimal 2 MB</span></div><div class="sub2"><span></span><span class="err" id="e_bukti" role="alert"></span></div></div>';
  }
  else if(f.type === 'check'){
    return '<div class="fld span2" data-for="setuju"><label class="check"><input type="checkbox" id="setuju"><span>Saya menyatakan masukan dan tanggapan ini dibuat dengan sebenar-benarnya dan untuk digunakan sebagai bukti perbaikan Data Pemilih Berkelanjutan.</span></label><div class="sub2"><span></span><span class="err" id="e_setuju" role="alert"></span></div></div>';
  }
  return '<div class="fld' + span + '" data-for="' + id + '"><label for="' + id + '">' + f.label + '</label>' + ctl + '<div class="sub2"><span class="hint" id="h_' + id + '">' + esc(hint) + '</span><span class="err" id="e_' + id + '" role="alert"></span></div></div>';
}
function buildForm(){
  var h = SECTIONS.map(function(s){
    return '<section class="sec"><div class="sec-head"><h2>' + s.title + '</h2><span class="sec-note">' + s.note + '</span></div><div class="grid">' + s.fields.map(fieldHTML).join('') + '</div></section>';
  }).join('');

/* ---------- data formulir ---------- */
var fileName = '', fileErr = '', submitted = null, attempted = false, touched = {};

/* ---------- isi dokumen Model A ---------- */
function rowsOf(rec){

function modelA(rec){

function fitPages(){

/* ---------- PDF ---------- */
function buildPdf(rec){
  var J = window.jspdf; if(!J) throw new Error('pdf');

    var lines = d.splitTextToSize(text, W);

    d.splitTextToSize(s, R - 98).forEach(function(l){ d.text(l, 98, y, {}); y += SL; });
  });
  y += 4;
  var cy = y + 11;
  if(LOGO_DATA_URL){ d.addImage(LOGO_DATA_URL, 'PNG', 94, y, 22, 22); }
  else { d.setDrawColor(150); d.setLineWidth(0.25); d.circle(105, cy, 11); d.setFontSize(7); d.setTextColor(130); d.text('LOGO KPU', 105, cy + 0.8, {align:'center'}); base(); }
  d.setDrawColor(0); d.setLineWidth(0.25); d.rect(R - 52, cy - 7.25, 52, 14.5);
  d.text('Model A-Tanggapan', R - 26, cy - 1.3, {align:'center'}); d.text('Masyarakat-PDPB', R - 26, cy + 3.6, {align:'center'});
  y += 22 + 8;
  block('FORMULIR TANGGAPAN DAN MASUKAN MASYARAKAT\nTERHADAP PEMUTAKHIRAN DATA PEMILIH BERKELANJUTAN (PDPB)', 'center', LH); y += 2;
  block('KPU ' + (rec.kpu || '') + ' pada hari ' + HARI[t.getDay()] + ' tanggal ' + t.getDate() + ' bulan ' + BULAN[t.getMonth()] + ' tahun ' + t.getFullYear() + ' tanggapan dan masukan terhadap Pemutakhiran Data Pemilih Berkelanjutan dari:', 'justify', LH); y += 2;
  block('NIK: ' + (g.nik || ''), 'left', LH); y += 2; block('Nama: ' + (g.nama || ''), 'left', LH); y += 2; block('Alamat: ' + (g.alamat || ''), 'left', LH); y += 2;
  block('Materi/alasan memberikan tanggapan/masukan karena:', 'left', LH);
  [1,2,3].forEach(function(n){ need(LH); d.text(rec.alasan === n ? '[ X ]' : '[    ]', L, y); d.text(n + '. ' + ALASAN[n], L + 14, y); y += LH; });
  y += 2; block('Materi tanggapan dan masukan adalah sebagai berikut:', 'left', LH); y += 1;
  var w1 = 52, w2 = 6, w3 = W - w1 - w2;
  rowsOf(rec).forEach(function(r){
    var vl = d.splitTextToSize(r[1] || '', w3 - 4), ll = d.splitTextToSize(r[0], w1 - 4), n = Math.max(1, vl.length, ll.length), h = n * SL + 2.4;
    need(h + 4); var top = y - 4;
    d.rect(L, top, w1, h); d.rect(L + w1, top, w2, h); d.rect(L + w1 + w2, top, w3, h);
    d.text(ll, L + 2, top + 4.6, {lineHeightFactor:1.15}); d.text(':', L + w1 + w2 / 2, top + 4.6, {align:'center'}); d.text(vl, L + w1 + w2 + 2, top + 4.6, {lineHeightFactor:1.15});
    y = top + h + 4;
  });
  y += LH - 4 + 2;
  block('Demikian masukan dan tanggapan ini dibuat dengan sebenar-benarnya dan untuk digunakan sebagai bukti perbaikan Data Pemilih Berkelanjutan.', 'justify', LH);
  need(66); y += 4;
  var kota = (rec.kpu || '').replace(/^(kabupaten|kota)\s+/i, '');
  d.splitTextToSize(kota + ', ' + t.getDate() + ' ' + BULAN[t.getMonth()] + ' Tahun ' + t.getFullYear(), 82).forEach(function(l){ d.text(l, 148, y, {align:'center'}); y += SL; });
  d.text('KPU ' + (rec.kpu || 'Kabupaten/Kota'), 62, y, {align:'center'}); d.text('Pemberi Masukan/Tanggapan', 148, y, {align:'center'});
  d.setFont('helvetica', 'italic'); d.setFontSize(9); d.setTextColor(110); d.text('Disetujui secara elektronik', 148, y + 13, {align:'center'}); base();
  d.text('(.................................)', 62, y + 26, {align:'center'});
  var nm = d.splitTextToSize('(' + (g.nama || '.................................') + ')', 82); d.text(nm, 148, y + 26, {align:'center', lineHeightFactor:1.15});
  y += 26 + nm.length * SL + 8; need(34);
  var ky = y; base();
  d.splitTextToSize('KETUA KOMISI PEMILIHAN UMUM,', 86).forEach(function(l){ d.text(l, 147, ky, {align:'center'}); ky += SL; });
  var kb = ky - SL; d.text('ttd.', 147, kb + 12, {align:'center'}); d.text('MOCHAMMAD AFIFUDDIN', 147, kb + 24, {align:'center'});

/* ---------- pengiriman ---------- */
/* Isi dengan alamat Web App dari Apps Script (lihat PANDUAN-PASANG.md). Selama kosong, form berjalan dalam mode contoh dan tidak mengirim apa pun. */
var ENDPOINT = '';
var fileObj = null, startedAt = Date.now();
function toast(m){ var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function(){ t.hidden = true; }, 4200); }
function newTicket(){ var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '', i, buf = new Uint8Array(4); (window.crypto || {getRandomValues:function(b){ for(i=0;i<b.length;i++) b[i]=Math.floor(Math.random()*256); }}).getRandomValues(buf); for(i = 0; i < 4; i++) s += a[buf[i] % a.length]; return 'PDPB-' + TODAY.replace(/-/g,'') + '-' + s; }
function saveBlob(name, blob){ var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function pdfFor(rec){ try{ saveBlob('Model-A-' + rec.ticket + '.pdf', buildPdf(rec).output('blob')); }catch(e){ toast('PDF belum siap. Coba lagi sebentar lagi.'); } }
function fileToB64(file){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(file); }); }
function send(rec, attempt){
  var pdfB64 = buildPdf(rec).output('datauristring').split('base64,')[1];
  return fileToB64(fileObj).then(function(b64){
    var payload = Object.assign({}, rec, {buktiName:fileObj.name, buktiMime:fileObj.type, buktiB64:b64, pdfB64:pdfB64, hp:($('hp') || {}).value || '', fillMs:Date.now() - startedAt});
    return fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.ok) return j;
    if(j.code === 'duplicate' && attempt < 2){ rec.ticket = newTicket(); return send(rec, attempt + 1); }
    throw j;
  });
}

/* ---------- tab dan peristiwa ---------- */
function resetForm(){
  $('theForm').reset(); fileName = ''; fileErr = ''; fileObj = null; startedAt = Date.now(); submitted = null; attempted = false; touched = {};
  $('doneCard').hidden = true; $('theForm').hidden = false; updateDerived(); showErrors(); renderPreview(); window.scrollTo(0, 0);
}
function onField(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute('inputmode') === 'numeric') t.value = t.value.replace(/\D/g, '');
  if(t.id === 'bukti'){
    var f = t.files && t.files[0]; fileName = ''; fileErr = ''; fileObj = null;
    if(f){
      if(!/\.(pdf|jpe?g|png)$/i.test(f.name)) fileErr = 'Format harus PDF, JPG, atau PNG';
      else if(f.size > 2 * 1024 * 1024) fileErr = 'Ukuran berkas melebihi 2 MB';
      else { fileName = f.name; fileObj = f; $('h_bukti').textContent = f.name + ' (' + Math.max(1, Math.round(f.size / 1024)) + ' KB)'; }
      if(fileErr){ t.value = ''; $('h_bukti').textContent = 'PDF, JPG, atau PNG, maksimal 2 MB'; }
    }
    touched.bukti = true;
  }
  if(t.name === 'alasan') touched.alasan = true;
  if(t.id === 'setuju') touched.setuju = true;
  if(!submitted){ updateDerived(); renderPreview(); }
  showErrors();
}

function init(){
  buildForm(); updateDerived(); renderPreview();
  var form = $('theForm');
  form.addEventListener('input', onField); form.addEventListener('change', onField);
  form.addEventListener('focusout', function(e){ if(e.target.id){ touched[e.target.id] = true; showErrors(); } });
  form.addEventListener('submit', function(e){
    e.preventDefault(); attempted = true;
    var errs = showErrors(), first = ALL_IDS.filter(function(id){ return errs[id]; })[0];
    if(first){ var el = first === 'alasan' ? document.querySelector('input[name=alasan]') : $(first); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } toast('Periksa isian yang bertanda merah.'); return; }
    var btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Mengirim...';
    var rec = collect(); rec.ticket = newTicket(); rec.createdAt = Date.now(); rec.status = 'Baru';
    var demo = !/^https:\/\//.test(ENDPOINT);
    (demo ? Promise.resolve({ok:true}) : send(rec, 0)).then(function(){
      submitted = rec; renderPreview(); form.hidden = true;
      var dc = $('doneCard'); dc.hidden = false;
      dc.innerHTML = '<div class="done"><h2>Tanggapan terkirim</h2><div class="ticket">' + esc(rec.ticket) + '</div><p>Simpan nomor tiket ini. Helpdesk KPU Kabupaten Malang akan memeriksa tanggapan Anda dan menindaklanjutinya. Dokumen Model A di samping sudah terisi sesuai data Anda; unduh sebagai bukti.</p>' + (demo ? '<p class="fine">Mode contoh: alamat server belum diatur, jadi data ini tidak dikirim ke mana pun.</p>' : '') + '<div class="row"><button class="btn primary" type="button" id="dlPdf">Unduh PDF Model A</button><button class="btn" type="button" id="again">Isi tanggapan lain</button></div></div>';
      $('dlPdf').onclick = function(){ pdfFor(rec); }; $('again').onclick = function(){ btn.disabled = false; btn.textContent = 'Kirim tanggapan'; resetForm(); };
      dc.scrollIntoView({block:'start'});
    }).catch(function(err){
      btn.disabled = false; btn.textContent = 'Kirim tanggapan';
      toast(err && err.message ? err.message : 'Tanggapan belum terkirim. Periksa koneksi internet lalu coba lagi.');
    });
  });
  window.addEventListener('resize', fitPages);
  if(window.ResizeObserver){ new ResizeObserver(fitPages).observe($('paper')); }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitPages); }
  fitPages();
}
init();
